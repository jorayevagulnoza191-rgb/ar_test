<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AR 3D Detal</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root { --g1:#0b3d2e; --g2:#14532d; --g3:#166534; --y:#facc15; --txt:#f0fdf4; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:var(--g1); color:var(--txt); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { display:flex; flex-direction:column; }
  header { padding:calc(10px + env(safe-area-inset-top)) 14px 8px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  header h1 { font-size:20px; }
  #name { font-size:15px; color:var(--y); font-weight:600; }
  model-viewer { flex:1; width:100%; background:radial-gradient(circle at 50% 40%, #f8fafc, #cbd5e1); --poster-color:transparent; }
  #arBtn { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); background:var(--y); color:var(--g1); border:none; border-radius:14px; padding:14px 26px; font-size:18px; font-weight:700; box-shadow:0 4px 14px rgba(0,0,0,.3); }
  #noAr { position:absolute; left:12px; right:12px; bottom:16px; text-align:center; background:rgba(11,61,46,.9); padding:10px; border-radius:12px; font-size:14px; display:none; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--g1); font-size:18px; font-weight:600; }
  .bar { display:flex; gap:8px; padding:8px 12px; overflow-x:auto; scrollbar-width:none; }
  .bar::-webkit-scrollbar { display:none; }
  .b { flex:none; background:var(--g3); color:var(--txt); border:none; border-radius:12px; padding:12px 16px; font-size:16px; font-weight:600; min-height:46px; cursor:pointer; }
  .b.on { background:var(--y); color:var(--g1); }
  .views .b { flex:1; padding:12px 6px; }
  #models { padding-bottom:calc(10px + env(safe-area-inset-bottom)); }
</style>
</head>
<body>

<header>
  <h1>AR 3D Detal</h1>
  <div id="name"></div>
</header>

<model-viewer id="mv"
  camera-controls touch-action="pan-y"
  ar ar-modes="webxr quick-look" ar-placement="floor" ar-scale="auto"
  shadow-intensity="1" exposure="1.05"
  min-camera-orbit="auto 0.1deg auto" max-camera-orbit="auto 180deg auto"
  interpolation-decay="120">
  <button slot="ar-button" id="arBtn">📱 Stolga qo'yish (AR)</button>
  <div id="loading">Yuklanmoqda…</div>
</model-viewer>
<div id="noAr">Bu telefonda AR yo'q. Detalni barmoq bilan aylantirib ko'ring.</div>

<div class="bar views" id="views">
  <button class="b on" data-v="3d">3D</button>
  <button class="b" data-v="V">Old (V)</button>
  <button class="b" data-v="H">Ust (H)</button>
  <button class="b" data-v="W">Chap (W)</button>
</div>
<div class="bar" id="models"></div>

<script>
  // 15 soniyada yuklanmasa — sababini ko'rsatish
  setTimeout(() => {
    const l = document.getElementById("loading");
    if (l && l.style.display !== "none") l.textContent = "Yuklanmadi. Internetni tekshiring va sahifani Chrome'da GitHub manzili orqali oching.";
  }, 15000);
</script>
<script type="module">
import * as THREE from "three";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

const mv = document.getElementById("mv");
const MAT = new THREE.MeshStandardMaterial({ color:0xd9a441, roughness:.55, metalness:0 });
const EDGE = new THREE.LineBasicMaterial({ color:0x1f2937 });

// Profil (x,y) bo'yicha shakl, chuqurlik z bo'yicha cho'ziladi. O'lchamlar mm.
function shape(pts, holes = []) {
  const s = new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1])));
  holes.forEach(h => { const c = new THREE.Path(); c.absarc(h[0], h[1], h[2], 0, Math.PI * 2, true); s.holes.push(c); });
  return s;
}
function part(s, depth) {
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled:false, curveSegments:48 });
  const grp = new THREE.Group();
  grp.add(new THREE.Mesh(g, MAT));
  grp.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 25), EDGE));
  return grp;
}
const rect = (w, h) => [[0,0],[w,0],[w,h],[0,h]];

const MODELS = [
  { name:"Pog'onali detal", make() {
      return part(shape([[0,0],[160,0],[160,50],[80,50],[80,120],[0,120]]), 100);
  }},
  { name:"Ariqchali detal", make() {
      return part(shape([[0,0],[160,0],[160,80],[110,80],[110,40],[50,40],[50,80],[0,80]]), 100);
  }},
  { name:"Teshikli planka", make() {
      const p = part(shape(rect(160,100), [[50,50,22],[115,50,14]]), 30);
      p.rotation.x = -Math.PI / 2;               // stolga yotqizish
      return p;
  }},
  { name:"Tayanch", make() {
      const g = new THREE.Group();
      const base = part(shape(rect(160,100)), 30); base.rotation.x = -Math.PI / 2; base.position.z = 100;
      const wall = part(shape(rect(160,110), [[80,70,22]]), 30); wall.position.y = 30;
      g.add(base, wall);
      return g;
  }},
  { name:"Silindrli detal", make() {
      const g = new THREE.Group();
      const base = part(shape(rect(150,100)), 30); base.rotation.x = -Math.PI / 2; base.position.z = 100;
      const ring = new THREE.Shape(); ring.absarc(0, 0, 38, 0, Math.PI * 2, false);
      const hole = new THREE.Path(); hole.absarc(0, 0, 16, 0, Math.PI * 2, true); ring.holes.push(hole);
      const cyl = part(ring, 70);
      cyl.rotation.x = -Math.PI / 2; cyl.position.set(75, 30, 50);
      g.add(base, cyl);
      return g;
  }},
  { name:"T-simon detal", make() {
      return part(shape([[0,0],[160,0],[160,35],[105,35],[105,120],[55,120],[55,35],[0,35]]), 90);
  }}
];

// Modelni GLB ga aylantirib model-viewer ga berish
const exporter = new GLTFExporter();
let lastURL = null;
function load(i) {
  const scene = new THREE.Scene();
  const obj = MODELS[i].make();
  const holder = new THREE.Group(); holder.add(obj);
  // markazlash, pastini y=0 ga, mm → m
  const box = new THREE.Box3().setFromObject(holder), c = box.getCenter(new THREE.Vector3());
  obj.position.sub(new THREE.Vector3(c.x, box.min.y, c.z));
  holder.scale.setScalar(0.001);
  scene.add(holder);
  exporter.parse(scene, glb => {
    if (lastURL) URL.revokeObjectURL(lastURL);
    lastURL = URL.createObjectURL(new Blob([glb], { type:"model/gltf-binary" }));
    mv.src = lastURL;
    setView("3d");
  }, err => { document.getElementById("loading").textContent = "Xato: " + err; }, { binary:true });
  document.getElementById("name").textContent = MODELS[i].name;
  document.querySelectorAll("#models .b").forEach((b, k) => b.classList.toggle("on", k === i));
}

document.getElementById("models").innerHTML = MODELS.map((m, i) => `<button class="b" data-i="${i}">${m.name}</button>`).join("");
document.getElementById("models").addEventListener("click", e => { const b = e.target.closest(".b"); if (b) load(+b.dataset.i); });

// Ko'rinishlar: V — old, H — ust, W — chap
const VIEWS = {
  "3d": { orbit:"35deg 65deg auto", fov:"auto" },
  "V":  { orbit:"0deg 90deg auto",   fov:"12deg" },
  "H":  { orbit:"0deg 0.1deg auto",  fov:"12deg" },
  "W":  { orbit:"-90deg 90deg auto", fov:"12deg" }
};
function setView(v) {
  mv.cameraOrbit = VIEWS[v].orbit;
  mv.fieldOfView = VIEWS[v].fov;
  mv.cameraTarget = "auto auto auto";
  document.querySelectorAll("#views .b").forEach(b => b.classList.toggle("on", b.dataset.v === v));
}
document.getElementById("views").addEventListener("click", e => { const b = e.target.closest(".b"); if (b) setView(b.dataset.v); });

// Qo'lda aylantirilsa — 3D tugmasi yonsin
mv.addEventListener("camera-change", e => {
  if (e.detail.source === "user-interaction" && mv.fieldOfView !== "auto") {
    mv.fieldOfView = "auto";
    document.querySelectorAll("#views .b").forEach(b => b.classList.toggle("on", b.dataset.v === "3d"));
  }
});

mv.addEventListener("load", () => {
  document.getElementById("loading").style.display = "none";
  if (!mv.canActivateAR) document.getElementById("noAr").style.display = "block";
});

load(0);
</script>
</body>
</html>
