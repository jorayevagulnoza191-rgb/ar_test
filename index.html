<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AR Chizma</title>
<style>
  :root { --g1:#0b3d2e; --g2:#14532d; --g3:#166534; --txt:#f0fdf4; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:#000; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--txt); }
  #video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; }
  #stage { position:fixed; inset:0; touch-action:none; overflow:hidden; }
  #overlay { position:absolute; left:50%; top:50%; width:70vmin; transform-origin:center; pointer-events:none; user-select:none; }
  #grid { position:fixed; inset:0; pointer-events:none; display:none;
    background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);
    background-size:10vmin 10vmin; background-position:center; }

  /* Boshlang'ich oyna */
  #start { position:fixed; inset:0; z-index:20; background:var(--g1); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:18px; text-align:center; overflow-y:auto; }
  #start h1 { font-size:30px; letter-spacing:1px; }
  .tpls { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; width:100%; max-width:420px; }
  .tpl { background:#fff; border:4px solid transparent; border-radius:14px; padding:8px; cursor:pointer; color:#0b3d2e; font-weight:600; font-size:14px; }
  .tpl img { width:100%; aspect-ratio:1; display:block; }
  .tpl.on { border-color:#facc15; }
  .big { background:#facc15; color:#0b3d2e; border:none; border-radius:14px; padding:16px 28px; font-size:18px; font-weight:700; width:100%; max-width:420px; cursor:pointer; }
  .alt { background:var(--g3); color:var(--txt); }
  #msg { color:#fecaca; font-size:15px; max-width:420px; }

  /* Boshqaruv paneli */
  #panel { position:fixed; left:0; right:0; bottom:0; z-index:10; background:rgba(11,61,46,.92); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); display:none; }
  .row { display:flex; align-items:center; gap:10px; margin:6px 0; }
  .row label { width:34px; text-align:center; font-size:20px; }
  input[type=range] { flex:1; accent-color:#facc15; height:28px; }
  .btns { display:flex; gap:6px; justify-content:space-between; flex-wrap:wrap; }
  .b { flex:1; min-width:44px; background:var(--g3); color:var(--txt); border:none; border-radius:10px; padding:10px 4px; font-size:20px; cursor:pointer; }
  .b.on { background:#facc15; color:#0b3d2e; }
  #hide { position:fixed; top:calc(10px + env(safe-area-inset-top)); right:10px; z-index:11; display:none; }
  #hide .b { padding:8px 12px; background:rgba(11,61,46,.85); }
  #lockMark { position:fixed; top:calc(12px + env(safe-area-inset-top)); left:12px; z-index:11; font-size:26px; display:none; }
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<div id="grid"></div>
<div id="stage"><img id="overlay" alt=""></div>
<div id="lockMark">🔒</div>
<div id="hide"><button class="b" id="bHide">⌄</button></div>

<div id="panel">
  <div class="row"><label>◐</label><input type="range" id="op" min="5" max="100" value="55"></div>
  <div class="row"><label>⤢</label><input type="range" id="sz" min="20" max="300" value="100"></div>
  <div class="btns">
    <button class="b" id="bRotL">↺</button>
    <button class="b" id="bRotR">↻</button>
    <button class="b" id="bFlip">⇋</button>
    <button class="b" id="bGrid">▦</button>
    <button class="b" id="bLock">🔓</button>
    <button class="b" id="bLight">🔦</button>
    <button class="b" id="bBack">▤</button>
  </div>
</div>

<div id="start">
  <h1>AR Chizma</h1>
  <div class="tpls" id="tpls"></div>
  <button class="big alt" id="bUpload">🖼 Rasm yuklash</button>
  <input type="file" id="file" accept="image/*" hidden>
  <button class="big" id="bGo">📷 Boshlash</button>
  <div id="msg"></div>
</div>

<script>
// ---------- Chizma namunalari (SVG) ----------
const S = 'stroke="#000" fill="none" stroke-linecap="round" stroke-linejoin="round"';
const T = 'stroke-width="5"';                       // asosiy chiziq
const N = 'stroke-width="1.8"';                     // ingichka chiziq
const AX = 'stroke-width="1.8" stroke-dasharray="34 7 4 7"'; // o'q chizig'i
const wrap = b => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">${b}</svg>`;

const TEMPLATES = [
  { name:"Tutashma", svg: wrap(`
    <g ${S}>
      <line x1="50" y1="300" x2="530" y2="300" ${AX}/>
      <line x1="170" y1="180" x2="170" y2="420" ${AX}/>
      <line x1="440" y1="220" x2="440" y2="380" ${AX}/>
      <path ${T} d="M178.9,220.5 L445.6,250.3 A50,50 0 0 1 445.6,349.7 L178.9,379.5 A80,80 0 1 1 178.9,220.5 Z"/>
      <circle cx="170" cy="300" r="40" ${T}/>
      <circle cx="440" cy="300" r="22" ${T}/>
    </g>`) },
  { name:"Uchta proyeksiya", svg: wrap(`
    <g ${S} transform="translate(40,60) scale(1.3)">
      <polygon ${T} points="60,80 140,80 140,150 220,150 220,200 60,200"/>
      <rect ${T} x="300" y="80" width="100" height="120"/>
      <line ${T} x1="300" y1="150" x2="400" y2="150"/>
      <rect ${T} x="60" y="250" width="160" height="100"/>
      <line ${T} x1="140" y1="250" x2="140" y2="350"/>
    </g>`) },
  { name:"Girih yulduz", svg: wrap(`
    <g ${S}>
      <line x1="70" y1="300" x2="530" y2="300" ${AX}/>
      <line x1="300" y1="70" x2="300" y2="530" ${AX}/>
      <circle cx="300" cy="300" r="200" ${N}/>
      <rect ${T} x="158.6" y="158.6" width="282.8" height="282.8"/>
      <polygon ${T} points="300,100 500,300 300,500 100,300"/>
      <circle cx="300" cy="300" r="60" ${T}/>
    </g>`) },
  { name:"Flanets", svg: wrap(`
    <g ${S}>
      <line x1="80" y1="300" x2="520" y2="300" ${AX}/>
      <line x1="300" y1="80" x2="300" y2="520" ${AX}/>
      <circle cx="300" cy="300" r="125" ${AX}/>
      <circle cx="300" cy="300" r="190" ${T}/>
      <circle cx="300" cy="300" r="60" ${T}/>
      <circle cx="388.4" cy="211.6" r="22" ${T}/>
      <circle cx="211.6" cy="211.6" r="22" ${T}/>
      <circle cx="211.6" cy="388.4" r="22" ${T}/>
      <circle cx="388.4" cy="388.4" r="22" ${T}/>
    </g>`) }
];
const toURL = svg => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);

// ---------- Elementlar ----------
const $ = id => document.getElementById(id);
const video = $("video"), overlay = $("overlay"), stage = $("stage");
let current = toURL(TEMPLATES[0].svg);
let stream = null, track = null;

// Namunalarni chiqarish
TEMPLATES.forEach((t, i) => {
  const d = document.createElement("div");
  d.className = "tpl" + (i === 0 ? " on" : "");
  d.innerHTML = `<img src="${toURL(t.svg)}" alt=""><div>${t.name}</div>`;
  d.onclick = () => {
    document.querySelectorAll(".tpl").forEach(x => x.classList.remove("on"));
    d.classList.add("on"); current = toURL(t.svg);
  };
  $("tpls").appendChild(d);
});

$("bUpload").onclick = () => $("file").click();
$("file").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { current = r.result; document.querySelectorAll(".tpl").forEach(x => x.classList.remove("on")); start(); };
  r.readAsDataURL(f);
};

// ---------- Kamera ----------
async function start() {
  $("msg").textContent = "";
  overlay.src = current;
  reset();
  try {
    if (!stream) {
      stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:"environment" }, width:{ ideal:1920 }, height:{ ideal:1080 } }, audio:false });
      video.srcObject = stream;
      track = stream.getVideoTracks()[0];
    }
    $("start").style.display = "none";
    $("panel").style.display = "block";
    $("hide").style.display = "block";
  } catch (err) {
    $("msg").textContent = "Kamera ochilmadi. Brauzerga kameradan foydalanishga ruxsat bering va sahifani qayta oching.";
  }
}
$("bGo").onclick = start;
$("bBack").onclick = () => { $("start").style.display = "flex"; $("panel").style.display = "none"; $("hide").style.display = "none"; };

// ---------- Holat va transformatsiya ----------
let tx = 0, ty = 0, sc = 1, rot = 0, flip = 1, locked = false;
function apply() {
  overlay.style.transform = `translate(-50%,-50%) translate(${tx}px,${ty}px) rotate(${rot}deg) scale(${sc * flip},${sc})`;
  $("sz").value = Math.round(sc * 100);
}
function reset() { tx = ty = 0; sc = 1; rot = 0; flip = 1; apply(); }

$("op").oninput = e => overlay.style.opacity = e.target.value / 100;
overlay.style.opacity = .55;
$("sz").oninput = e => { if (!locked) { sc = e.target.value / 100; apply(); } };
$("bRotL").onclick = () => { if (!locked) { rot -= 15; apply(); } };
$("bRotR").onclick = () => { if (!locked) { rot += 15; apply(); } };
$("bFlip").onclick = () => { if (!locked) { flip *= -1; apply(); } };
$("bGrid").onclick = e => { const g = $("grid"); const on = g.style.display !== "block"; g.style.display = on ? "block" : "none"; e.currentTarget.classList.toggle("on", on); };
$("bLock").onclick = e => { locked = !locked; e.currentTarget.textContent = locked ? "🔒" : "🔓"; e.currentTarget.classList.toggle("on", locked); $("lockMark").style.display = locked ? "block" : "none"; };

let torch = false;
$("bLight").onclick = async e => {
  if (!track) return;
  try { torch = !torch; await track.applyConstraints({ advanced:[{ torch }] }); e.currentTarget.classList.toggle("on", torch); }
  catch { torch = false; e.currentTarget.style.opacity = .4; }
};

let panelHidden = false;
$("bHide").onclick = () => { panelHidden = !panelHidden; $("panel").style.display = panelHidden ? "none" : "block"; $("bHide").textContent = panelHidden ? "⌃" : "⌄"; };

// ---------- Barmoq bilan surish, kattalashtirish, burish ----------
const pts = new Map();
let g0 = null;
function gesture() {
  const p = [...pts.values()];
  if (p.length === 1) return { x:p[0].x, y:p[0].y, d:0, a:0 };
  const dx = p[1].x - p[0].x, dy = p[1].y - p[0].y;
  return { x:(p[0].x + p[1].x) / 2, y:(p[0].y + p[1].y) / 2, d:Math.hypot(dx, dy), a:Math.atan2(dy, dx) * 180 / Math.PI };
}
function begin() { g0 = { ...gesture(), tx, ty, sc, rot, n:pts.size }; }
stage.addEventListener("pointerdown", e => { if (locked) return; stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x:e.clientX, y:e.clientY }); if (pts.size <= 2) begin(); });
stage.addEventListener("pointermove", e => {
  if (locked || !pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (!g0 || pts.size > 2) return;
  const g = gesture();
  tx = g0.tx + g.x - g0.x; ty = g0.ty + g.y - g0.y;
  if (g0.n === 2 && pts.size === 2 && g0.d > 0) {
    sc = Math.min(3, Math.max(.2, g0.sc * g.d / g0.d));
    rot = g0.rot + g.a - g0.a;
  }
  apply();
});
const end = e => { pts.delete(e.pointerId); if (pts.size) begin(); else g0 = null; };
stage.addEventListener("pointerup", end);
stage.addEventListener("pointercancel", end);
</script>
</body>
</html>
